# Production Nginx: TLS on 443, Spring Boot HTTP on 127.0.0.1:8080
#
#   Internet --HTTPS 443--> Nginx --HTTP localhost:8080--> Spring Boot WAR
#
# 1. Replace YOUR_DOMAIN and the certificate paths.
# 2. Install as /etc/nginx/sites-available/sspd and enable it.
# 3. sudo nginx -t && sudo systemctl reload nginx
#
# Obtain certificates (example):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d YOUR_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    client_max_body_size 200M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws-clinic/ {
        proxy_pass         http://127.0.0.1:8080/ws-clinic/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Native Android clients connect to the exact endpoint without a trailing slash.
    # Keep this exact match so the request does not fall through to location / and lose
    # the WebSocket Upgrade headers.
    location = /ws-native {
        proxy_pass         http://127.0.0.1:8080/ws-native;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
