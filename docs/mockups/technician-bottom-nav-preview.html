<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technician Bottom Navigation Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      background: #e7edf2; font-family: system-ui, "Noto Sans Myanmar", sans-serif;
    }
    .phone {
      width: min(390px, 100vw); height: 260px; overflow: hidden; position: relative;
      background: #f4f7fa; border-radius: 24px 24px 0 0; box-shadow: 0 18px 44px #1720332e;
    }
    .caption { padding: 24px; color: #172033; font-weight: 750; font-size: 17px; }
    .caption small { display: block; margin-top: 5px; color: #647184; font-weight: 500; font-size: 12px; }
    .nav {
      height: 84px; width: 100%; position: absolute; bottom: 0; display: grid;
      grid-template-columns: repeat(5, 1fr); align-items: end; background: white;
      box-shadow: 0 -4px 16px #17203318;
    }
    .notch {
      position: absolute; left: 50%; top: -1px; width: 108px; height: 44px;
      transform: translateX(-50%); background: #f4f7fa;
      border-radius: 0 0 54px 54px; box-shadow: inset 0 -1px 0 #cbd7e0;
    }
    .item {
      height: 62px; position: relative; z-index: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px; color: #647184; font-size: 11px;
      font-weight: 650;
    }
    .item svg { width: 24px; height: 24px; fill: currentColor; }
    .item.active { color: #0f766e; }
    .job-space { height: 62px; }
    .job {
      width: 66px; height: 66px; z-index: 2; position: absolute; left: 50%; top: -35px;
      transform: translateX(-50%); border-radius: 50%; display: grid; place-items: center;
      background: #0f2a3d; color: white; box-shadow: 0 8px 14px #17203345, 0 0 0 6px #f4f7fa;
    }
    .job svg { width: 31px; height: 31px; fill: currentColor; }
  </style>
</head>
<body>
  <main class="phone">
    <div class="caption">Technician App <small>Centered Jobs button with a curved bottom-bar notch</small></div>
    <nav class="nav" aria-label="Main navigation">
      <div class="notch"></div>
      <div class="item">
        <svg viewBox="0 0 24 24"><path d="m12 3-9 8h3v9h5v-6h2v6h5v-9h3z"/></svg><span>Home</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24"><path d="M5 3h14l2 5v12H3V8zm2 7v3h10v-3zm0 5v3h10v-3z"/></svg><span>Products</span>
      </div>
      <div class="job-space"></div>
      <div class="item">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 8 8h-2a7 7 0 1 1-7-6v5l4-3.5L12 3zm-2 10H5v2h6zm8 0h-6v2h6z"/></svg><span>History</span>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v12H6l-2 2zm3 4v2h10V8zm0 4v2h7v-2z"/></svg><span>အတန်းများ</span>
      </div>
      <div class="job" aria-label="Jobs">
        <svg viewBox="0 0 24 24"><path d="m22.7 19-6.3-6.3a6.7 6.7 0 0 0-8.7-8.9l3.7 3.7-2.5 2.5-3.7-3.7a6.7 6.7 0 0 0 8.9 8.7l6.3 6.3a1.6 1.6 0 0 0 2.3-2.3z"/></svg>
      </div>
    </nav>
  </main>
</body>
</html>
