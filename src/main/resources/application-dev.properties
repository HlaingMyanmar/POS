# Local development. Start with:
#   SPRING_PROFILES_ACTIVE=dev
# or
#   -Dspring.profiles.active=dev
#
# Secrets still come from environment variables, .env, or application-secrets.properties.

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,https://localhost:8080,https://127.0.0.1:8080}
app.download.base-url=${APP_BASE_URL:http://localhost:8080}
app.apk.storage-dir=${APP_APK_STORAGE_DIR:./apk-storage}
backup.root-directory=${BACKUP_ROOT_DIRECTORY:./Backup}
