# Production (Ubuntu VPS). Start with:
#   SPRING_PROFILES_ACTIVE=prod
# or
#   -Dspring.profiles.active=prod
#
# Architecture: Internet --HTTPS 443--> Nginx --HTTP 127.0.0.1:8080--> Spring Boot
# Do not put secrets in this file. Set them in /opt/sspd/.env or the process environment.

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.ssl.enabled=${SSL_ENABLED:false}
server.forward-headers-strategy=framework

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.download.base-url=${APP_BASE_URL}
app.apk.storage-dir=${APP_APK_STORAGE_DIR:/opt/sspd/apk}
backup.root-directory=${BACKUP_ROOT_DIRECTORY:/opt/sspd/Backup}
backup.mysqldump-path=${MYSQLDUMP_PATH:}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
app.schema.java-migrations.enabled=false
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
