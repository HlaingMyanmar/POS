spring.application.name=servicemgmt
spring.config.import=optional:file:./application-secrets.properties

# ── Hibernate Second Level Cache (Caffeine JCache) ──────────────────────────
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ser_db?rewriteBatchedStatements=true&useServerPrepStmts=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform = org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Flyway owns all database schema changes.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Pre-Flyway schema baseline
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
app.schema.java-migrations.enabled=${JAVA_SCHEMA_MIGRATIONS_ENABLED:false}

# JWT secret must be a Base64-encoded key of at least 32 random bytes.
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
server.address=0.0.0.0
server.port=8080
server.max-http-request-header-size=65536
server.tomcat.max-swallow-size=20971520
server.tomcat.max-http-form-post-size=20971520
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# HTTPS / SSL
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:servicemgmt}

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=https://localhost:8080,https://127.0.0.1:8080,https://192.168.100.253:8080,https://192.168.20.249:8080,https://192.168.100.120:8080

# Android APK download base URL — server ရဲ့ public HTTPS URL ထည့်ပါ
app.download.base-url=https://192.168.20.253:8080

# APK file သိမ်းဆည်းမည့် folder (server မှာ ရှိရမည်)
app.apk.storage-dir=C:/sspd-apk

# Database backup
backup.root-directory=./Backup
backup.daily.cron=0 30 5 * * *
backup.weekly.cron=0 40 5 * * SUN
backup.monthly.cron=0 50 5 1 * *
backup.retention.daily=7
backup.retention.weekly=4
backup.retention.monthly=12
backup.retention.manual=30
backup.retention.safety=7
backup.time-zone=Asia/Rangoon
backup.legacy-settings-scheduler.enabled=false
backup.property-scheduler.enabled=false
