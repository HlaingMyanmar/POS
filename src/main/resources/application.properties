spring.application.name=servicemgmt
spring.config.import=optional:file:./.env[.properties],optional:file:./application-secrets.properties,optional:file:/opt/sspd/.env[.properties],optional:file:/opt/sspd/application-secrets.properties

# ── Hibernate Second Level Cache (Caffeine JCache) ──────────────────────────
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ser_db?rewriteBatchedStatements=true&useServerPrepStmts=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform = org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Flyway owns all database schema changes.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
app.schema.java-migrations.enabled=${JAVA_SCHEMA_MIGRATIONS_ENABLED:false}

# JWT secret must be a Base64-encoded key of at least 32 random bytes.
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=65536
server.tomcat.max-swallow-size=20971520
server.tomcat.max-http-form-post-size=20971520
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# HTTPS / SSL — production should keep this false (Nginx terminates TLS).
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:servicemgmt}

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080}

# Public URL used in APK download links (no trailing slash required)
app.download.base-url=${APP_BASE_URL:http://localhost:8080}
# Mobile APK downloads use IP so phones do not need DNS for sspdmyanmar.com
app.download.apk-origin=${APP_DOWNLOAD_APK_ORIGIN:http://118.27.151.89}

# Directory that stores uploaded APK files (must be writable)
app.apk.storage-dir=${APP_APK_STORAGE_DIR:./apk-storage}

# Optional overlay for voucher HTML/CSS (WAR classpath is the fallback)
app.print.templates-dir=${APP_PRINT_TEMPLATES_DIR:}
app.booking-photo.storage-dir=${BOOKING_PHOTO_STORAGE_DIR:./booking-photo-storage}
app.product-photo.storage-dir=${PRODUCT_PHOTO_STORAGE_DIR:./product-photo-storage}

# Database backup
backup.root-directory=${BACKUP_ROOT_DIRECTORY:./Backup}
backup.mysqldump-path=${MYSQLDUMP_PATH:}
backup.daily.cron=0 30 5 * * *
backup.weekly.cron=0 40 5 * * SUN
backup.monthly.cron=0 50 5 1 * *
backup.retention.daily=7
backup.retention.weekly=4
backup.retention.monthly=12
backup.retention.manual=30
backup.retention.safety=7
backup.time-zone=Asia/Rangoon
backup.legacy-settings-scheduler.enabled=false
backup.property-scheduler.enabled=false

# Predefined admin diagnostic queries (READ-only catalog; disable in production if not needed)
app.admin-query.enabled=${ADMIN_QUERY_ENABLED:true}
app.admin-query.max-rows=${ADMIN_QUERY_MAX_ROWS:500}
app.admin-query.timeout-seconds=${ADMIN_QUERY_TIMEOUT_SECONDS:30}

# Optional env bootstrap. Prefer the first-run UI when the database has no users.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:hlainghtun2018@gmail.com}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:hlainghtun}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
