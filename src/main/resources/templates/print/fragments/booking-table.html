<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><title>fragment</title></head>
<body>

<!-- Compact A5/A4/POS intake list: max 10 rows, one line per device. -->
<div th:fragment="render(inv)" class="bk-table">

  <table th:if="${not #strings.isEmpty(inv.problemDesc)}" class="bk-complaint">
    <tr>
      <td class="bk-complaint__bar"></td>
      <td class="bk-complaint__body">
        <div class="bk-kicker">Customer Complaint</div>
        <div class="bk-complaint__text" th:text="${inv.problemDesc}"></div>
      </td>
    </tr>
  </table>

  <div class="bk-list-head">
    <span>Received Items</span>
    <span th:if="${inv.deviceRows != null and not #lists.isEmpty(inv.deviceRows)}">
      <th:block th:text="${#lists.size(inv.deviceRows)}"></th:block>
      <th:block th:text="${#lists.size(inv.deviceRows) == 1 ? ' item' : ' items'}"></th:block>
      <th:block th:if="${inv.deviceRowTotal != null and inv.deviceRowTotal > 10}"
                th:text="${' / ' + inv.deviceRowTotal}"></th:block>
    </span>
  </div>

  <table class="bk-grid">
    <thead>
      <tr>
        <th class="bk-c-no">#</th>
        <th class="bk-c-dev">Device</th>
        <th class="bk-c-sn">Serial</th>
        <th class="bk-c-col">Color</th>
        <th class="bk-c-prob">Problem</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="dev, stat : ${inv.deviceRows}">
        <td class="bk-c-no" th:text="${stat.count}"></td>
        <td class="bk-c-dev">
          <div class="bk-dev-name" th:text="${not #strings.isEmpty(dev.brand) ? dev.brand : '—'}"></div>
          <div class="bk-dev-meta">
            <span th:if="${!#strings.isEmpty(dev.deviceType)}" th:text="${dev.deviceType}"></span>
            <span th:if="${!#strings.isEmpty(dev.deviceType) and !#strings.isEmpty(dev.model)}"> · </span>
            <span th:if="${!#strings.isEmpty(dev.model)}" th:text="${dev.model}"></span>
          </div>
        </td>
        <td class="bk-c-sn" th:text="${not #strings.isEmpty(dev.serialNo) ? dev.serialNo : '—'}"></td>
        <td class="bk-c-col" th:text="${not #strings.isEmpty(dev.color) ? dev.color : '—'}"></td>
        <td class="bk-c-prob">
          <div th:text="${not #strings.isEmpty(dev.problemDesc) ? dev.problemDesc : '—'}"></div>
          <div class="bk-extra"
               th:if="${!#strings.isEmpty(dev.accessories) or !#strings.isEmpty(dev.deviceConditions) or !#strings.isEmpty(dev.noticed)}">
            <span th:if="${!#strings.isEmpty(dev.accessories)}" th:text="${'Acc: ' + dev.accessories}"></span>
            <span th:if="${!#strings.isEmpty(dev.deviceConditions)}" th:text="${'Cond: ' + dev.deviceConditions}"></span>
            <span th:if="${!#strings.isEmpty(dev.noticed)}" th:text="${'Note: ' + dev.noticed}"></span>
          </div>
        </td>
      </tr>
      <tr th:if="${inv.deviceRows == null or #lists.isEmpty(inv.deviceRows)}">
        <td colspan="5" class="bk-empty">No received items recorded</td>
      </tr>
    </tbody>
  </table>

  <div th:if="${inv.deviceRowTotal != null and inv.deviceRowTotal > 10}" class="bk-cap">
    Voucher တွင် ပစ္စည်း ၁၀ ခုအထိသာ ပြသည်။
  </div>

  <table th:if="${not #strings.isEmpty(inv.remark)}" class="bk-remark">
    <tr>
      <td>
        <div class="bk-kicker">General Remark</div>
        <div th:text="${inv.remark}"></div>
      </td>
    </tr>
  </table>
</div>

</body>
</html>
