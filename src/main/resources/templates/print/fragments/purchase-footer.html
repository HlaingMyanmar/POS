<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><title>purchase-footer</title></head>
<body>
<div th:fragment="last(inv)">
  <div class="inv-bottom">
    <div class="inv-payment-col">
      <div th:if="${inv.showPaymentHistory and not #lists.isEmpty(inv.payments)}">
        <div class="inv-section-label">Payment History</div>
        <div class="inv-table-wrap inv-table-wrap--sm">
          <table class="inv-pay-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Method</th>
                <th class="r">Amount</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${inv.payments}">
                <td th:text="${p.date}">—</td>
                <td>
                  <div th:text="${#strings.contains(p.method,'||') ? #strings.substringBefore(p.method,'||') : p.method}">—</div>
                  <div th:if="${#strings.contains(p.method,'||')}"
                       style="font-size:9px; color:#64748b; margin-top:1px;"
                       th:text="${'Txn: ' + #strings.substringAfter(p.method,'||')}"></div>
                </td>
                <td class="r" th:text="${p.amount}">0</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div th:if="${not #strings.isEmpty(inv.customerNotice)}" style="margin-top:10px;">
        <div class="inv-section-label">Notice</div>
        <div class="inv-notice" th:text="${inv.customerNotice}"></div>
      </div>
    </div>
    <div class="inv-summary-col">
      <div class="inv-summary-box">
        <div class="inv-summary-row">
          <span class="inv-summary-row__label">Total</span>
          <span class="inv-summary-row__value" th:text="${inv.subtotal}">0</span>
        </div>
        <div class="inv-summary-row">
          <span class="inv-summary-row__label">Overall Discount</span>
          <span class="inv-summary-row__value" th:text="${inv.discount}">0</span>
        </div>
        <div class="inv-summary-row" th:if="${not #strings.isEmpty(inv.tax) and inv.tax != '0.00' and inv.tax != '0'}">
          <span class="inv-summary-row__label">Tax / VAT</span>
          <span class="inv-summary-row__value" th:text="${inv.tax}">0</span>
        </div>
        <div class="inv-summary-row" th:if="${not #strings.isEmpty(inv.otherCharges) and inv.otherCharges != '0.00' and inv.otherCharges != '0'}">
          <span class="inv-summary-row__label">Other Charges</span>
          <span class="inv-summary-row__value" th:text="${inv.otherCharges}">0</span>
        </div>
        <div class="inv-summary-row inv-summary-row--sub">
          <span class="inv-summary-row__label">Grand Total</span>
          <span class="inv-summary-row__value" th:text="${inv.netAmount}">0</span>
        </div>
        <div class="inv-summary-row">
          <span class="inv-summary-row__label">Paid</span>
          <span class="inv-summary-row__value" th:text="${inv.paid}">0</span>
        </div>
        <div class="inv-summary-row inv-summary-row--highlight">
          <span class="inv-summary-row__label">Balance</span>
          <span class="inv-summary-row__value" th:text="${inv.balanceDue}">0</span>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${not #strings.isEmpty(inv.remark)}" style="margin-top:14px;">
    <div class="inv-section-label">Remarks</div>
    <div class="inv-remark" th:text="${inv.remark}"></div>
  </div>
  <div th:if="${inv.showSignatures}" class="inv-signatures">
    <div class="inv-sign">
      <div class="inv-sign__line" th:text="${inv.sign1Label ?: 'Prepared By'}"></div>
    </div>
    <div class="inv-sign">
      <div class="inv-sign__line" th:text="${inv.sign2Label ?: 'Received By'}"></div>
    </div>
  </div>
  <div class="inv-footer">
    <span th:text="${inv.companyName}"></span>
    <span th:if="${not #strings.isEmpty(inv.footerNote)}" th:text="${' · ' + inv.footerNote}"></span>
    <span th:text="${' · Page ' + inv.currentPage + ' of ' + inv.totalPages}"></span>
  </div>
</div>
<div th:fragment="cont(inv)" class="inv-footer">
  <span th:text="${inv.invoiceNo}"></span>
  <span> · Continued on next page · </span>
  <span th:text="${'Page ' + inv.currentPage + ' of ' + inv.totalPages}"></span>
</div>
</body>
</html>
