<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!--
  FRAGMENT: service-job-table
  Columns (toggleable): # · Service / Part · Type · Qty · Est. Price · Est. Amount
  showSerial toggles the Type column.
-->
<head><title>fragment</title></head>
<body>

<div th:fragment="render(inv)" class="inv-table-wrap">
  <table class="inv-table">
    <thead>
      <tr>
        <th th:if="${inv.showColRowNo}" class="inv-table__col-center" style="width:5%">#</th>
        <th th:if="${inv.showColItem}">Service / Part</th>
        <th th:if="${inv.showSerial}">Type</th>
        <th th:if="${inv.showColQty}" class="inv-table__col-center" style="width:7%">Qty</th>
        <th th:if="${inv.showColUnitPrice}" class="inv-table__col-right" style="width:11%">Est. Price</th>
        <th th:if="${inv.showColAmount}" class="inv-table__col-right" style="width:12%">Est. Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="item : ${inv.pageItems}" class="inv-table__row">
        <td th:if="${inv.showColRowNo}" class="inv-table__col-center"
            style="color:#94a3b8; font-weight:600; font-size:11px;"
            th:text="${item.rowNo}">1</td>
        <td th:if="${inv.showColItem}">
          <div style="font-weight:500;" th:text="${item.productName}">Service Name</div>
          <div th:if="${not #strings.isEmpty(item.warrantyLabel)}"
               class="inv-table__sub" style="color:#4f46e5;"
               th:text="${'Warranty: ' + item.warrantyLabel}"></div>
        </td>
        <td th:if="${inv.showSerial}" class="inv-table__sub"
            th:text="${not #strings.isEmpty(item.serialInfo) ? item.serialInfo : '—'}">Service</td>
        <td th:if="${inv.showColQty}" class="inv-table__col-center" style="font-weight:600;" th:text="${item.qty}">1</td>
        <td th:if="${inv.showColUnitPrice}" class="inv-table__col-right" th:text="${item.unitPrice}">0</td>
        <td th:if="${inv.showColAmount}" class="inv-table__col-right" style="font-weight:600;" th:text="${item.subtotal}">0</td>
      </tr>
      <tr th:if="${#lists.isEmpty(inv.pageItems)}">
        <td th:colspan="${inv.tableColSpan}" class="inv-table__empty">No services or parts recorded yet</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
