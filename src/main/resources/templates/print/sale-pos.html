<!-- Sale 80mm/58mm — sale-header / sale-table / sale-footer -->
<div th:class="${'invoice-page invoice-page--' + #strings.toLowerCase(layout.name).replace('_','-')}"
     xmlns:th="http://www.thymeleaf.org">
  <div th:replace="~{print/fragments/sale-header :: render(${inv})}"></div>
  <div class="inv-body">
    <div th:replace="~{print/fragments/sale-table :: render(${inv})}"></div>
    <th:block th:if="${inv.currentPage == inv.totalPages}">
      <div th:replace="~{print/fragments/sale-footer :: last(${inv})}"></div>
    </th:block>
    <th:block th:if="${inv.currentPage < inv.totalPages}">
      <div th:replace="~{print/fragments/sale-footer :: cont(${inv})}"></div>
    </th:block>
  </div>
</div>
