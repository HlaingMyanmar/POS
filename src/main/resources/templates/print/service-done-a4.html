<!-- Service done A4 — header / table / footer -->
<div class="invoice-page invoice-page--a4" xmlns:th="http://www.thymeleaf.org">
  <div th:replace="~{print/fragments/service-done-header :: render(${inv})}"></div>
  <div class="inv-body">
    <div th:replace="~{print/fragments/service-done-table :: render(${inv})}"></div>
    <th:block th:if="${inv.currentPage == inv.totalPages}">
      <div th:replace="~{print/fragments/service-done-footer :: last(${inv})}"></div>
    </th:block>
    <th:block th:if="${inv.currentPage < inv.totalPages}">
      <div th:replace="~{print/fragments/service-done-footer :: cont(${inv})}"></div>
    </th:block>
  </div>
</div>
