
<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSPD Service Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Pyidaungsu', 'Noto Sans Myanmar', 'Myanmar Text', 'Padauk', 'Inter', 'Segoe UI', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
        body { font-family: 'Pyidaungsu', 'Noto Sans Myanmar', 'Myanmar Text', 'Padauk', 'Inter', 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
    </style>
    <script>
      // Shims for legacy libraries
      window.global = window;
      window.process = { 
        env: { NODE_ENV: 'production' },
        nextTick: (fn) => setTimeout(fn, 0)
      };
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900 lang-my">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
